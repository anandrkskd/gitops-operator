{{- if eq .Values.certProvider "cert-manager" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openshift-gitops-operator-controller-manager--selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshift-gitops-operator-controller-manager-service-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: openshift-gitops-operator-controller-manager-service-cert
  usages:
  - server auth
  isCA: false
  dnsNames:
  - openshift-gitops-operator-controller-manager-service.{{ .Release.Namespace }}
  - openshift-gitops-operator-controller-manager-service.{{ .Release.Namespace }}.svc
  - openshift-gitops-operator-controller-manager-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: openshift-gitops-operator-controller-manager--selfsigned-issuer
  duration: 17520h0m0s
  renewBefore: 24h0m0s
{{- end }}
