---
apiVersion: v1
data:
  controller_manager_config.yaml: |
    apiVersion: controller-runtime.sigs.k8s.io/v1alpha1
    kind: ControllerManagerConfig
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: 127.0.0.1:8080
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: 2b63967d.openshift.io
kind: ConfigMap
metadata:
  name: openshift-gitops-operator-manager-config
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: openshift-gitops-operator-controller-manager
  name: openshift-gitops-operator-metrics-monitor-bearer-token
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    openshift.io/description: This ConfigMap is used for Prometheus monitoring of
      the GitOps Operator.
    openshift.io/display-name: GitOps Operator Prometheus Monitor ConfigMap
    openshift.io/owning-component: service-ca
    service.beta.openshift.io/inject-cabundle: "true"
  name: openshift-gitops-operator-metrics-monitor-ca-bundle
  namespace: {{ .Release.Namespace }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: gitops-operator
  name: openshift-gitops-operator-metrics-monitor
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - bearerTokenSecret:
      key: token
      name: openshift-gitops-operator-metrics-monitor-bearer-token
    interval: 30s
    path: /metrics
    port: metrics
    scheme: https
    tlsConfig:
      ca:
        configMap:
          key: service-ca.crt
          name: openshift-gitops-operator-metrics-monitor-ca-bundle
      serverName: openshift-gitops-operator-metrics-service.openshift-gitops-operator.svc
  selector:
    matchLabels:
      control-plane: gitops-operator
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: kube-rbac-proxy-tls
  creationTimestamp: null
  labels:
    control-plane: gitops-operator
  name: openshift-gitops-operator-metrics-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: metrics
    port: 8443
    protocol: TCP
    targetPort: metrics
  selector:
    control-plane: gitops-operator
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  creationTimestamp: null
  name: openshift-gitops-operator-prometheus
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  creationTimestamp: null
  name: openshift-gitops-operator-prometheus
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshift-gitops-operator-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: openshift-monitoring
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  name: openshift-gitops-operator-webhook-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: gitops-operator
status:
  loadBalancer: {}
