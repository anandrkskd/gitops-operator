---
apiVersion: v1
kind: Service
metadata:
  name: openshift-gitops-operator-controller-manager-service
  namespace: {{ .Release.Namespace }}
  {{- if eq .Values.certProvider "service-ca" }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: openshift-gitops-operator-controller-manager-service-cert
  {{- end }}
spec:
  selector:
    control-plane: gitops-operator
  ports:
  - name: "443"
    port: 443
    targetPort: 9443
